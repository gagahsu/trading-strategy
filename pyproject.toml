[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atrgrid"
version = "1.0.0"
description = "ATR 自適應網格 · 台股零股每日建議系統"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "certifi>=2024.2.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
atrgrid = "atrgrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atrgrid = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
