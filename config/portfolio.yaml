# 持股清單（依 2026-08-17 對帳資料建立）
#
# ★★ ticker 欄位務必先核對 ★★
# 下方代號是依名稱推定的，尚未經交易所資料驗證，所以 ticker_verified 全部為
# false —— 未驗證的標的不會產生任何下單建議。
#
# 流程：
#   1. 標示 TBD* 的請填入正確代號
#   2. 執行 `atrgrid verify-tickers`（會比對交易所登記名稱）
#   3. 全部相符後，把各檔的 ticker_verified 改成 true
#
# avg_cost = 對帳單的「成本 ÷ 股數」。
# class: equity（股票型）/ bond（債券型，免證交稅）/ leveraged（槓桿型）

holdings:
